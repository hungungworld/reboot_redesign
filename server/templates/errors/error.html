{% extends "base.html" %}
{% block title %}{{ code }} · REBOOT{% endblock %}
{% block body_class %}auth-body{% endblock %}
{% block body %}
<main class="auth-card" style="text-align:center">
  <p class="eyebrow">ERROR {{ code }}</p>
  <h1 style="margin-top:10px">{{ message }}</h1>
  <p style="margin-top:24px"><a class="btn lime block" href="{{ url_for('core.dashboard') }}">대시보드로 가기</a></p>
</main>
{% endblock %}
